<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sign App · Usability Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E6EAF0; --ink:#141C28; --muted:#5A6676; --line:#CDD4DE; --wire:#E4E9EF; --wire2:#D3DAE3;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --risk:#C0352E; --warn:#A86500; --ok:#1E7A4C;
  --bezel:#0D131B; --screen:#F8FAFC; --scrim:rgba(10,16,24,.48); --sys:#F2F3F6; --paper:#FFFFFF;
  --f-ui:"IBM Plex Sans Thai",-apple-system,"Sukhumvit Set","Noto Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* type scale · base 16px สำหรับเนื้อหา */
  --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:18px; --fs-xl:20px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A0E13; --ink:#E5EAF1; --muted:#95A1B1; --line:#2B3542; --wire:#212A35; --wire2:#2C3744;
  --accent:#7097FF; --accent-ink:#0A1224; --risk:#FF7B70; --warn:#EFB04C; --ok:#4FC48C;
  --bezel:#000; --screen:#11171F; --scrim:rgba(0,0,0,.6); --sys:#232A33; --paper:#1A212B; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:var(--fs-md);line-height:1.5;overflow:hidden}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* device: framed on desktop, edge-to-edge on phones */
/* ขนาดเครื่องคงที่ 440×956 แล้วย่อทั้งเครื่องให้พอดีจอ → ทุกหน้ากว้างเท่ากัน */
.phone{position:fixed;left:50%;top:50%;width:440px;height:956px;transform:translate(-50%,-50%) scale(var(--s,1));background:var(--bezel);border-radius:56px;padding:11px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.lyr{display:contents}
.scr{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:var(--screen);display:flex;flex-direction:column;font-size:var(--fs-md);user-select:none;-webkit-user-select:none}
.island{width:30%;height:32px;background:#000;border-radius:20px;position:absolute;left:50%;top:11px;transform:translateX(-50%);z-index:20}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:16px 30px 4px;font:600 14px var(--f-ui);flex:0 0 auto}
@media (max-width:520px){
  body{display:block}
  .phone{position:static;transform:none;height:100dvh;width:100vw;border-radius:0;padding:0;background:var(--screen);box-shadow:none}
  .scr{border-radius:0;padding-top:env(safe-area-inset-top,0px)}
  .island,.sbar{display:none}
  .abar,.sheet .sf{padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))!important}
}

/* common */
.mh{display:flex;align-items:center;gap:10px;padding:8px 14px 6px;flex:0 0 auto}
.ib{width:32px;height:32px;border-radius:50%;background:var(--wire);display:grid;place-items:center;font-size:var(--fs-md);color:var(--muted);flex:0 0 auto;cursor:pointer;border:0}
.mh .t{flex:1;min-width:0}
.mh .t b{display:block;font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh .t small{color:var(--muted);font-size:var(--fs-xs)}
.ctx{margin:0 14px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:color-mix(in srgb,var(--accent) 10%,var(--screen));border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);font-size:var(--fs-sm);flex:0 0 auto}
.ctx .sw{width:8px;height:24px;border-radius:2px;background:var(--accent)}
.ctx .who{flex:1;min-width:0;line-height:1.3}
.ctx .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cert{font:500 var(--fs-xs) var(--f-mono);display:flex;align-items:center;gap:4px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.r{background:var(--risk)}
.seg{display:flex;margin:10px 14px 4px;background:var(--wire);border-radius:9px;padding:2px;flex:0 0 auto}
.seg button{all:unset;flex:1;text-align:center;padding:6px 0;border-radius:7px;font-size:var(--fs-sm);color:var(--muted);cursor:pointer;position:relative}
.seg button.on{background:var(--screen);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg .bdg{position:absolute;top:3px;right:18%;width:8px;height:8px;border-radius:50%;background:var(--risk)}
.body{flex:1;overflow:auto;padding:8px 14px 16px;display:flex;flex-direction:column;gap:9px;min-height:0;-webkit-overflow-scrolling:touch}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:600 var(--fs-xs) var(--f-mono);padding:3px 7px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.r{color:var(--risk);border-color:color-mix(in srgb,var(--risk) 45%,transparent);background:color-mix(in srgb,var(--risk) 8%,transparent)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.chip.a{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.card{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--screen);min-width:0}
.card .l{font-size:var(--fs-sm);color:var(--muted);display:block}
.card .v{font-weight:600;font-size:var(--fs-md);line-height:1.45;display:block}
.card.big .v{font:600 var(--fs-xl) var(--f-mono);letter-spacing:-.01em}
.card.risk{border-color:color-mix(in srgb,var(--risk) 50%,transparent);background:color-mix(in srgb,var(--risk) 6%,var(--screen))}
.card.risk .l{color:var(--risk)}
.blk{border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:6px}
.blk h5{margin:0;font-size:var(--fs-sm);font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.bul{display:flex;gap:7px;font-size:var(--fs-md);line-height:1.45}
.bul i{font-style:normal;color:var(--muted)}
.pref{font:500 var(--fs-xs) var(--f-mono);color:var(--accent);border-bottom:1px dotted var(--accent);white-space:nowrap;cursor:pointer}
.step{display:flex;align-items:center;gap:8px;font-size:var(--fs-md)}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 var(--fs-xs) var(--f-mono);border:1.5px solid var(--line);flex:0 0 auto}
.step .n.done{background:var(--ok);border-color:var(--ok);color:#fff}
.step .n.me{border-color:var(--accent);color:var(--accent)}
.step small{color:var(--muted);margin-left:auto;font:400 var(--fs-xs) var(--f-mono)}
.abar{flex:0 0 auto;padding:10px 14px 22px;border-top:1px solid var(--line);background:var(--screen);display:flex;gap:8px;align-items:center}
.btn{font:600 var(--fs-md) var(--f-ui);border-radius:12px;padding:0 14px;height:48px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--screen);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.btn.ghost{border-color:transparent;background:var(--wire)}
.btn.danger{color:var(--risk)}
.btn.full{width:100%}
.btn:disabled{background:var(--wire);border-color:var(--wire);color:var(--muted);cursor:not-allowed}
.btn:focus-visible,.ib:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:var(--fs-sm);color:var(--muted);line-height:1.45}
.banner{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border-radius:8px;font-size:var(--fs-md);line-height:1.45}
.banner.r{background:color-mix(in srgb,var(--risk) 12%,var(--screen));color:var(--risk);border:1px solid color-mix(in srgb,var(--risk) 40%,transparent)}
.banner.w{background:color-mix(in srgb,var(--warn) 12%,var(--screen));color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.banner.i{background:color-mix(in srgb,var(--accent) 9%,var(--screen));color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.banner.ok{background:color-mix(in srgb,var(--ok) 11%,var(--screen));color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.shim{background:linear-gradient(90deg,var(--wire) 0%,var(--wire2) 50%,var(--wire) 100%);background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}

/* inbox */
.ih{padding:6px 18px 4px;flex:0 0 auto}
.ih h1{margin:0;font-size:28px;font-weight:700}
.ih .ent{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--muted);margin-top:2px}
.filters{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;flex:0 0 auto}
.filters span{font-size:var(--fs-sm);padding:5px 11px;border-radius:16px;border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.filters span.on{background:var(--ink);color:var(--screen);border-color:var(--ink)}
.item{border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:5px;cursor:pointer;background:var(--screen)}
.item:active{background:var(--wire)}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item b{font-size:var(--fs-md);line-height:1.45}
.item .amt{font:600 var(--fs-md) var(--f-mono);white-space:nowrap}
.item .sub{font-size:var(--fs-sm);color:var(--muted)}
.tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--line);padding:6px 0 22px;background:var(--screen)}
.tabbar span{flex:1;text-align:center;font-size:var(--fs-xs);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar span i{font-style:normal;font-size:var(--fs-xl)}
.tabbar span.on{color:var(--accent)}
@media (max-width:520px){.tabbar{padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}}

/* pdf */
.pdf{flex:1;overflow:auto;background:var(--wire);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0;position:relative;-webkit-overflow-scrolling:touch}
.page{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:18px 16px;display:flex;flex-direction:column;gap:7px;position:relative;min-height:200px;flex:0 0 auto}
.page .pn{position:absolute;top:6px;right:8px;font:500 var(--fs-xs) var(--f-mono);color:var(--muted)}
.page h6{margin:0 0 2px;font-size:var(--fs-sm)}
.ln{height:6px;border-radius:3px;background:var(--wire2)}
.ln.s{width:58%}.ln.m{width:84%}
.hl{background:color-mix(in srgb,var(--warn) 22%,transparent);outline:1px dashed var(--warn);border-radius:3px;padding:5px 6px;font-size:var(--fs-sm);color:var(--warn);transition:box-shadow .3s}
.flash{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 45%,transparent)}
.pin{border:2px dashed var(--accent);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:3px;background:color-mix(in srgb,var(--accent) 7%,transparent);position:relative;cursor:pointer;margin-top:8px}
.pin b{font-size:var(--fs-sm);color:var(--accent)}
.pin .tag{position:absolute;top:-10px;left:10px;background:var(--accent);color:var(--accent-ink);font:600 var(--fs-xs) var(--f-mono);padding:2px 6px;border-radius:4px}
.pin.cur{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}
.pgind{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:var(--scrim);color:#fff;font:500 var(--fs-xs) var(--f-mono);padding:3px 9px;border-radius:10px;z-index:3;pointer-events:none;transition:opacity .3s}
.fab{position:absolute;right:14px;bottom:90px;display:flex;background:var(--ink);color:var(--screen);border-radius:24px;box-shadow:0 8px 20px -6px rgba(0,0,0,.4);overflow:hidden;z-index:3}
.fab button{all:unset;padding:11px 13px;font:600 var(--fs-sm) var(--f-ui);white-space:nowrap;cursor:pointer}
.fab button+button{border-left:1px solid color-mix(in srgb,var(--screen) 25%,transparent)}
.attbtn{position:absolute;left:14px;bottom:90px;z-index:3;background:var(--screen);border:1px solid var(--line);border-radius:20px;padding:9px 12px;font:600 var(--fs-sm) var(--f-ui);cursor:pointer;box-shadow:0 6px 16px -8px rgba(0,0,0,.35);color:var(--ink)}

/* sheets */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:10}
.in>.scrim{animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--screen);border-radius:22px 22px 0 0;z-index:11;display:flex;flex-direction:column;max-height:90%;box-shadow:0 -10px 30px -10px rgba(0,0,0,.35)}
.in .sheet{animation:up .25s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40%);opacity:.4}}
@keyframes fade{from{opacity:0}}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--wire2);margin:8px auto 4px;flex:0 0 auto}
.sheet .sh{padding:4px 16px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex:0 0 auto}
.sheet .sh b{font-size:var(--fs-lg)}
.sheet .sb{padding:0 16px 10px;overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:0}
.sheet .sf{padding:10px 16px 24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.row2{display:flex;justify-content:space-between;gap:10px;font-size:var(--fs-md);padding:6px 0;border-bottom:1px dashed var(--line)}
.row2:last-child{border-bottom:0}
.row2>span:first-child{color:var(--muted);flex:0 0 auto}
.row2>span:last-child,.row2>select{text-align:right;font-weight:500;min-width:0}
.row2 select{font:500 var(--fs-md) var(--f-ui);border:0;background:transparent;color:var(--accent);text-align-last:right}
.intent{display:flex;gap:10px;align-items:flex-start;font-size:var(--fs-md);padding:11px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.intent.on{border-color:var(--accent)}
.box{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:5px;flex:0 0 auto;display:grid;place-items:center;font-size:var(--fs-md);color:var(--accent-ink)}
.intent.on .box{background:var(--accent);border-color:var(--accent)}
.opt{display:flex;gap:8px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:var(--fs-md);cursor:pointer}
.opt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.radio{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted);flex:0 0 auto}
.opt.on .radio{border:5px solid var(--accent)}
.opt.dis{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{all:unset;font-size:var(--fs-sm);padding:5px 10px;border-radius:14px;border:1px solid var(--line);color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--screen);border-color:var(--ink)}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:400 var(--fs-md) var(--f-ui);min-height:80px;background:var(--screen);color:var(--ink);resize:none;user-select:text;-webkit-user-select:text}
textarea:focus{outline:2px solid var(--accent);border-color:transparent}

/* slide / hold */
.slide{position:relative;height:60px;border-radius:30px;background:var(--wire);overflow:hidden;touch-action:none;outline:none}
.slide.armed{background:color-mix(in srgb,var(--accent) 16%,var(--wire))}
.slide .fill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 28%,transparent);border-radius:30px;width:60px}
.slide .lbl{position:absolute;inset:0;display:grid;place-items:center;font:600 var(--fs-md) var(--f-ui);color:var(--muted);padding-left:44px;pointer-events:none}
.slide.armed .lbl{color:var(--accent)}
.slide .knob{position:absolute;left:4px;top:4px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:22px;box-shadow:0 3px 8px rgba(0,0,0,.25);cursor:grab;touch-action:none}
.slide.off .knob{background:var(--wire2);color:var(--muted);cursor:not-allowed;font-size:var(--fs-lg)}
.slide:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.hold{position:relative;overflow:hidden;width:100%;height:52px;border-radius:12px;border:1.5px solid var(--risk);color:var(--risk);background:var(--screen);font:600 var(--fs-md) var(--f-ui);cursor:pointer;touch-action:none}
.hold .hf{position:absolute;left:0;top:0;bottom:0;width:0;background:color-mix(in srgb,var(--risk) 22%,transparent)}
.hold span{position:relative}
.hold:disabled{opacity:.45;cursor:not-allowed}

/* biometric */
.sysd{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:280px;background:var(--sys);border-radius:24px;z-index:31;padding:22px 16px 0;text-align:center;box-shadow:0 20px 40px -10px rgba(0,0,0,.5)}
.in .sysd{animation:pop .2s}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.9);opacity:0}}
.sysd .face{width:68px;height:68px;margin:0 auto 10px;border:3px solid var(--ink);border-radius:18px;display:grid;place-items:center;font-size:28px;position:relative;overflow:hidden}
.sysd .face.scan::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--accent);animation:scan 1s ease-in-out infinite}
@keyframes scan{0%{top:0}50%{top:calc(100% - 3px)}100%{top:0}}
.sysd .face.bad{border-color:var(--risk);color:var(--risk);animation:shake .4s}
.sysd .face.good{border-color:var(--ok);color:var(--ok)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.sysd b{display:block;font-size:var(--fs-lg)}
.sysd p{font-size:var(--fs-sm);color:var(--muted);margin:6px 0 16px;line-height:1.45}
.sysd .act{border-top:1px solid var(--line);display:flex;margin:0 -16px}
.sysd .act button{all:unset;flex:1;padding:12px 0;font-size:var(--fs-lg);color:var(--accent);cursor:pointer;text-align:center}
.sysd .act button+button{border-left:1px solid var(--line)}
.pins{display:flex;justify-content:center;gap:14px;margin:8px 0 6px}
.pins i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink)}
.pins i.f{background:var(--ink)}
.pins.err{animation:shake .4s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0 10px}
.pad button{all:unset;height:50px;border-radius:25px;background:var(--wire);display:grid;place-items:center;font:500 22px var(--f-ui);cursor:pointer}
.pad button:active{background:var(--wire2)}
.pad button.e{background:transparent;cursor:default}

/* full screens */
.full{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:20px 24px;overflow:auto}
.full h3{font-size:var(--fs-xl);text-align:center;margin:0;text-wrap:balance}
.prog{display:flex;flex-direction:column;gap:11px}
.ps{display:flex;gap:10px;align-items:center;font-size:var(--fs-md);color:var(--muted)}
.ps .ic{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:var(--fs-xs);flex:0 0 auto}
.ps.on{color:var(--ink);font-weight:600}
.ps.on .ic{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.ps.done{color:var(--ink)}
.ps.done .ic{background:var(--ok);border-color:var(--ok);color:#fff}
.ps .t{margin-left:auto;font:400 var(--fs-xs) var(--f-mono);color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.big-ic{width:68px;height:68px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:32px;color:#fff}
.sigbox{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper)}
.sigbox .scrib{font:italic 600 24px/1 Georgia,"Times New Roman",serif;color:var(--accent);margin-bottom:6px}
.sigbox .meta{font:400 var(--fs-xs)/1.5 var(--f-mono);color:var(--muted)}
.toast{position:absolute;left:14px;right:14px;top:58px;z-index:40;background:var(--ink);color:var(--screen);border-radius:12px;padding:11px 13px;font-size:var(--fs-md);box-shadow:0 10px 20px -8px rgba(0,0,0,.4)}
.in .toast{animation:drop .25s}
@keyframes drop{from{transform:translateY(-20px);opacity:0}}
@media (max-width:520px){.toast{top:calc(10px + env(safe-area-inset-top,0px))}}
.msg{max-width:84%;padding:8px 11px;border-radius:14px;font-size:var(--fs-md);line-height:1.45}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--wire);border-bottom-left-radius:4px}
.msg small{display:block;opacity:.7;font-size:var(--fs-xs);margin-top:2px}

/* facilitator */
.fac{position:fixed;inset:auto 12px 12px auto;width:300px;max-height:80dvh;overflow:auto;background:var(--screen);border:1px solid var(--line);border-radius:12px;padding:14px;z-index:100;box-shadow:0 20px 40px -10px rgba(0,0,0,.4);font-size:var(--fs-sm)}
.fac h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between}
.fac fieldset{border:0;padding:0;margin:0 0 10px}
.fac legend{font:600 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.fac label{display:flex;gap:6px;align-items:center;padding:2px 0}
.fac .log{font:400 10.5px/1.5 var(--f-mono);background:var(--wire);border-radius:6px;padding:8px;max-height:200px;overflow:auto;white-space:pre-wrap}
.fac .kpi{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.fac .kpi div{background:var(--wire);border-radius:6px;padding:6px 8px}
.fac .kpi b{display:block;font:600 15px var(--f-mono)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="phone"><div class="scr" id="scr" aria-live="polite"><div class="lyr" id="lv"></div><div class="lyr" id="ls"></div><div class="lyr" id="lo"></div><div class="lyr" id="lt"></div></div></div>
<div class="fac" id="fac" hidden></div>

<script>
/* ================= data ================= */
const DOC = {
  title:"MSA ระบบ ERP กลุ่มบริษัท", file:"MSA-2026-0918.pdf · 42 หน้า · 31.4 MB",
  entity:"นาวา โฮลดิ้งส์ (ตัวอย่าง)", role:"กรรมการผู้มีอำนาจลงนาม · CEO",
  cp:"บริษัท ABC จำกัด (มหาชน)", val:"15,450,000", period:"1 ต.ค. 2026 – 30 ก.ย. 2027",
  risk:"เบี้ยปรับล่าช้าต่างจากสัญญามาตรฐาน 5%", sn:"7F3A21C9", name:"สมชาย ใจดี (ตัวอย่าง)",
  pins:[38,40,41], pages:42
};
const SCEN_DEFAULT = {face:"ok", outcome:"ok", doc:"normal", verify:"valid"};
let S, timers=[];
function reset(){
  timers.forEach(clearTimeout); timers=[];
  const scen = S ? S.scen : {...SCEN_DEFAULT};
  const log = S ? S.log : [];
  S = { view:"inbox", tab:0, sheet:null, overlay:null, intent:false, reason:"Approved", style:"stamp",
        pin:0, pinCode:"", faceTry:0, faceState:"scan", questions:[], unread:false, toast:null,
        attTab:0, askTo:0, draft:"", rejectText:"", scen, log, t0:null, signedTx:null, signedAt:null };
}
reset();

/* ================= logging (in-memory, for facilitator) ================= */
const KPI = {slipRelease:0, faceFail:0};
function ev(name){
  const now=Date.now();
  if(name==="open_doc") S.t0=now;
  const rel = S.t0 ? ((now-S.t0)/1000).toFixed(1)+"s" : "–";
  S.log.push(`${new Date(now).toLocaleTimeString("th-TH")}  +${rel}  ${name}`);
  if(!$("#fac").hidden) renderFac();
}

/* ================= helpers ================= */
const $=q=>document.querySelector(q);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
const blocked=()=>S.scen.doc==="blocked";
const fmtNow=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`};
const lines=(n,last="s")=>Array.from({length:n},(_,i)=>`<div class="ln ${i===n-1?last:''}"></div>`).join("");

const sbar=()=>`<div class="island"></div><div class="sbar"><span id="clock" title="">9:41</span><span class="mono" style="font-size:12px">5G ▮▮▮ 82%</span></div>`;
const mh=(sub)=>`<div class="mh"><button class="ib" data-a="close" aria-label="ปิดเอกสาร">✕</button><div class="t"><b>${DOC.title}</b><small>${sub||DOC.file}</small></div><button class="ib" data-a="more" aria-label="เพิ่มเติม">⋯</button></div>`;
const ctx=(cert)=>`<div class="ctx"><div class="sw"></div><div class="who"><b>ในนาม ${DOC.entity}</b>${DOC.role}</div>${cert||`<span class="cert"><span class="dot"></span>Cert OK</span>`}</div>`;
const seg=()=>`<div class="seg" role="tablist">${["สรุป","เอกสาร","สอบถาม"].map((t,i)=>`<button role="tab" class="${i===S.tab?'on':''}" data-a="tab" data-v="${i}">${t}${i===2&&S.unread?'<span class="bdg"></span>':''}</button>`).join("")}</div>`;
const fourCards=()=>`<div class="g2">
  <div class="card"><span class="l">คู่สัญญา</span><span class="v">${DOC.cp}</span></div>
  <div class="card big"><span class="l">มูลค่าธุรกรรม (THB)</span><span class="v">${DOC.val}</span></div>
  <div class="card"><span class="l">ระยะสัญญา</span><span class="v">${DOC.period}</span></div>
  <div class="card risk"><span class="l">⚠ ความเสี่ยงที่ถูกแฟล็ก</span><span class="v">${DOC.risk}</span></div></div>`;
const cosign=()=>`<div class="blk"><h5><span>ลำดับผู้ลงนาม · Dual Signers</span><span class="mono">1/2</span></h5>
  <div class="step"><span class="n done">✓</span>CFO · กัญญา (ตัวอย่าง)<small>30 ก.ย. 18:42</small></div>
  <div class="step"><span class="n me">2</span><b>คุณ · CEO</b><small>รอคุณ</small></div></div>`;
const abar=()=>`<div class="abar"><button class="btn ghost danger" data-a="reject">ปฏิเสธ</button><button class="btn ghost" data-a="tab" data-v="2">สอบถาม</button>${
  blocked()?`<button class="btn p" data-a="askattach">แจ้งเลขาฯ ให้แนบไฟล์</button>`
           :`<button class="btn p" data-a="guard">ตรวจและลงนาม · ${DOC.pins.length} จุด</button>`}</div>`;

/* ================= views ================= */
const V = {
inbox:()=>`${sbar()}<div class="ih"><h1>รอลงนาม</h1><span class="ent"><span class="dot"></span>${DOC.entity} ▾</span></div>
 <div class="filters"><span class="on">ทั้งหมด 5</span><span>ด่วน 2</span><span>มูลค่าสูง 1</span><span>รอผู้อื่น</span></div>
 <div class="body">
  <div class="item" data-a="open"><div class="top"><b>${DOC.title}</b><span class="amt">15.45M</span></div>
   <div class="chips"><span class="chip r">SLA วันนี้ 17:00</span><span class="chip a">Tier 3</span><span class="chip">CFO ลงนามแล้ว</span></div>
   <span class="sub">จาก แพรว (เลขาฯ) · ${DOC.cp}</span></div>
  <div class="item" data-a="openv"><div class="top"><b>NDA โครงการ Data Center</b><span class="amt">–</span></div>
   <div class="chips"><span class="chip ok">ลงนามแล้ว</span><span class="chip">ตรวจสอบไฟล์</span></div><span class="sub">ไฟล์ที่ได้รับกลับจากคู่สัญญาทางอีเมล</span></div>
  ${["PO วัสดุสำนักงาน ไตรมาส 4|0.82M|Tier 1","สัญญาเช่าพื้นที่สาขาเชียงใหม่|3.2M|Tier 2","บันทึกแต่งตั้งรักษาการ CIO|–|HR"].map(r=>{const[a,b,c]=r.split("|");return `<div class="item" data-a="oos"><div class="top"><b>${a}</b><span class="amt">${b}</span></div><div class="chips"><span class="chip">${c}</span></div></div>`}).join("")}
 </div>
 <div class="tabbar"><span class="on"><i>▤</i>Inbox</span><span><i>◷</i>ติดตาม</span><span><i>⛨</i>ความปลอดภัย</span></div>`,

loading:()=>`${sbar()}${mh("กำลังโหลด PDF · 18.6/31.4 MB")}${ctx(`<span class="cert"><span class="dot" style="background:var(--warn)"></span>กำลังตรวจ</span>`)}${seg()}
 <div class="body"><div class="banner i">สรุปพร้อมแล้ว อ่านต่อได้ทันที ตัวเอกสารกำลังโหลดอยู่เบื้องหลัง</div>${fourCards()}
 <div class="shim" style="height:96px"></div><div class="shim" style="height:70px"></div></div>
 <div class="abar"><button class="btn ghost danger" disabled>ปฏิเสธ</button><button class="btn p" disabled>กำลังตรวจความครบถ้วนไฟล์…</button></div>`,

doc:()=>{
  const body = S.tab===0 ? summary() : S.tab===1 ? canvas() : ask();
  return `${sbar()}${mh()}${ctx()}${seg()}${body}${S.tab===2?'':abar()}`;
},

sealing:()=>`${sbar()}<div class="full"><h3>กำลังผนึกลายมือชื่อดิจิทัลและประทับรับรองเวลา…</h3>
 <div class="prog" id="prog">${[["คำนวณ Document Digest","SHA-256"],["ขอสิทธิ์ใช้กุญแจลงนาม","CSC"],["ลงนามใน Cloud HSM","HSM"],["ประทับเวลาจาก TSA","RFC 3161"],["ผนึกข้อมูลตรวจสอบระยะยาว","PAdES-B-LTA"]].map((s,i)=>`<div class="ps" data-i="${i}"><span class="ic"></span>${s[0]}<span class="t">${s[1]}</span></div>`).join("")}</div>
 <div class="note" id="sealnote" style="text-align:center">กรุณาอย่าปิดแอป</div></div>`,

success:()=>`${sbar()}<div class="full" style="justify-content:flex-start;padding-top:40px">
 <div class="big-ic" style="background:var(--ok)">✓</div><h3>ลงนามแล้ว · เอกสารครบทุกผู้ลงนาม</h3>
 <div class="sigbox">${sigVisual(true)}</div>
 <div><div class="row2"><span>Transaction ID</span><span class="mono" style="font-size:var(--fs-sm)">${S.signedTx}</span></div>
 <div class="row2"><span>มาตรฐาน</span><span class="mono" style="font-size:var(--fs-sm)">PAdES-B-LTA · ${DOC.pins.length} จุด</span></div>
 <div class="row2"><span>สถานะ</span><span>Completed · 2/2</span></div></div>
 <div class="banner ok">แนบ Audit Trail &amp; Certificate of Completion เป็นหน้าสุดท้ายแล้ว</div></div>
 <div class="abar"><button class="btn ghost" data-a="verify">ตรวจสอบลายเซ็น</button><button class="btn p" data-a="inbox">กลับไป Inbox</button></div>`,

certerr:()=>`${sbar()}${mh()}${ctx(`<span class="cert" style="color:var(--risk)"><span class="dot r"></span>Revoked</span>`)}
 <div class="full" style="justify-content:flex-start;padding-top:28px"><div class="big-ic" style="background:var(--risk)">!</div><h3>ไม่สามารถลงนามได้</h3>
 <div class="banner r">ใบรับรองดิจิทัลของคุณหมดอายุหรือถูกเพิกถอน กรุณาติดต่อทีมไอทีหรือต่ออายุใบรับรองในแท็บตั้งค่า</div>
 <div><div class="row2"><span>Serial</span><span class="mono" style="font-size:var(--fs-sm)">…${DOC.sn}</span></div><div class="row2"><span>เอกสาร</span><span>ไม่ถูกแก้ไข · ยังรอลงนาม</span></div></div></div>
 <div class="abar"><button class="btn ghost" data-a="toast" data-v="โทรหา IT Helpdesk: 1234">ติดต่อ IT</button><button class="btn p" data-a="toast" data-v="หน้าจัดการใบรับรองไม่อยู่ในขอบเขตการทดสอบนี้">จัดการใบรับรอง</button></div>`,

neterr:()=>`${sbar()}${mh()}${ctx()}
 <div class="full" style="justify-content:flex-start;padding-top:28px"><div class="big-ic" style="background:var(--warn)">⟲</div><h3>การลงนามยังไม่เสร็จสมบูรณ์</h3>
 <div class="banner w">สัญญาณอินเทอร์เน็ตขัดข้อง การลงนามยังไม่เสร็จสมบูรณ์ กรุณาตรวจสอบการเชื่อมต่อและลองใหม่อีกครั้ง</div>
 <div><div class="row2"><span>สถานะเอกสาร</span><span>รอลงนาม</span></div><div class="row2"><span>ไฟล์</span><span>ไม่มีลายเซ็นค้างอยู่</span></div></div></div>
 <div class="abar"><button class="btn ghost" data-a="backdoc">ไว้ทีหลัง</button><button class="btn p" data-a="retrynet">ลองใหม่ด้วย Face ID</button></div>`,

rejected:()=>`${sbar()}<div class="full"><div class="big-ic" style="background:var(--muted)">↩</div><h3>ส่งเอกสารกลับให้ผู้ส่งแล้ว</h3>
 <div class="banner i">เหตุผล: ${esc(S.rejectText)}</div><div class="note" style="text-align:center">แพรว (เลขาฯ) ได้รับแจ้งแล้ว เอกสารย้ายไปที่แท็บติดตาม</div></div>
 <div class="abar"><button class="btn p" data-a="inbox">กลับไป Inbox</button></div>`,

verify:()=>{
  const tamper = S.scen.verify==="tamper" && !S.signedTx;
  const head = S.signedTx ? DOC.title : "NDA โครงการ Data Center";
  if(tamper) return `${sbar()}<div class="mh"><button class="ib" data-a="inbox" aria-label="ปิด">✕</button><div class="t"><b>${head}</b><small>ไฟล์จากอีเมลภายนอก</small></div></div>${ctx(`<span class="cert" style="color:var(--risk)"><span class="dot r"></span>Invalid</span>`)}
  <div class="body"><div class="banner r" style="font-weight:600;flex-direction:column;gap:2px">✕ เอกสารถูกดัดแปลงหลังการลงนาม · ลายมือชื่อดิจิทัลเป็นโมฆะ<span class="mono" style="font-weight:400;font-size:var(--fs-xs)">Signature Invalid: Document has been altered after signing</span></div>
  <div class="blk" style="opacity:.55"><h5><span>ผู้ลงนาม</span></h5><div class="step"><span class="n">–</span>ผู้แทน คู่สัญญา<small>ไม่ยืนยัน</small></div><div class="step"><span class="n">–</span>สมชาย · CEO<small>ไม่ยืนยัน</small></div></div>
  <div class="blk"><h5><span>สิ่งที่พบ</span></h5><div class="row2"><span>ส่วนที่ถูกแก้</span><span>หน้า 3 (ข้อมูลไม่ตรงกับที่ลงนาม)</span></div></div></div>
  <div class="abar"><button class="btn ghost" data-a="toast" data-v="แจ้ง Compliance แล้ว">แจ้ง Compliance</button><button class="btn p" data-a="toast" data-v="เปิดฉบับต้นฉบับจาก Archive (นอกขอบเขตการทดสอบ)">เปิดฉบับต้นฉบับ</button></div>`;
  return `${sbar()}<div class="mh"><button class="ib" data-a="inbox" aria-label="ปิด">✕</button><div class="t"><b>${head}</b><small>Completed</small></div></div>${ctx()}
  <div class="body"><div class="banner ok">✓ ลายมือชื่อดิจิทัลถูกต้องครบทุกผู้ลงนาม · เอกสารไม่ถูกแก้ไขหลังลงนาม</div>
  <div class="blk"><h5><span>ผู้ลงนาม</span></h5><div class="step"><span class="n done">✓</span>${S.signedTx?'กัญญา · CFO':'ผู้แทน คู่สัญญา'}<small>30/09 18:42</small></div><div class="step"><span class="n done">✓</span>สมชาย · CEO<small>${S.signedAt?S.signedAt.slice(0,16):'29/09 10:05'}</small></div></div>
  <div class="blk"><h5><span>รายละเอียดทางเทคนิค</span></h5><div class="row2"><span>ผู้ออกใบรับรอง</span><span>Thai CA (ตัวอย่าง)</span></div><div class="row2"><span>ประทับเวลา</span><span class="mono" style="font-size:var(--fs-sm)">TSA ✓</span></div><div class="row2"><span>ตรวจสอบระยะยาว</span><span class="mono" style="font-size:var(--fs-sm)">LTV ✓</span></div></div></div>
  <div class="abar"><button class="btn p" data-a="inbox">กลับไป Inbox</button></div>`;
}
};

function summary(){
  return `<div class="body">
  <div class="chips"><span class="chip r">SLA วันนี้ 17:00</span><span class="chip a">Tier 3 · &gt;10M</span><span class="chip">จัดซื้อจัดจ้าง</span><span class="chip ok">Legal ✓ 29 ก.ย.</span></div>
  ${blocked()?`<div class="banner w">⚠ ยังลงนามไม่ได้: ไม่พบใบเสนอราคาเปรียบเทียบรายที่ 3 ซึ่งบังคับสำหรับวงเงินเกิน 10 ล้านบาท</div>`:""}
  ${fourCards()}
  ${S.scen.doc==="noai"
   ?`<div class="blk" style="border-style:dashed"><h5><span>สรุปโดย AI</span><span style="color:var(--warn)">ไม่พร้อม</span></h5><div class="note">หน้า 20–42 เป็นภาพสแกนที่อ่านได้ไม่ชัด ระบบจึงยังไม่สรุปเพื่อหลีกเลี่ยงข้อมูลผิด</div></div>
     <div class="blk"><h5><span>บันทึกจากเลขาฯ</span><span class="mono">แพรว · 08:05</span></h5><div style="font-size:var(--fs-md)">ราคาต่ำกว่างบที่บอร์ดอนุมัติ 4% Legal แก้ข้อ 8.2 ตามที่ CFO ขอแล้ว</div></div>`
   :`<div class="blk"><h5><span>สรุปโดย AI</span><span class="mono">จาก 42 หน้า</span></h5>
   <div class="bul"><i>•</i><span>จ้าง ABC พัฒนาและดูแล ERP 12 เดือน แบ่งจ่าย 4 งวด <span class="pref" data-a="jump" data-v="6">น.6</span></span></div>
   <div class="bul"><i>•</i><span>เบี้ยปรับล่าช้า 0.1%/วัน เพดาน 5% ต่ำกว่ามาตรฐาน 10% <span class="pref" data-a="jump" data-v="12">น.12 ข้อ 8.2</span></span></div>
   <div class="bul"><i>•</i><span>ถือ Source code ร่วมกัน ฝ่ายกฎหมายรับทราบแล้ว <span class="pref" data-a="jump" data-v="19">น.19</span></span></div></div>`}
  ${cosign()}
  <div class="blk"><h5><span>ไฟล์แนบบังคับ</span>${blocked()?'<span style="color:var(--warn)">2/3</span>':'<span style="color:var(--ok)">ครบ 3/3</span>'}</h5>
   <div class="bul"><i>✓</i>มติคณะกรรมการ ครั้งที่ 9/2026</div><div class="bul"><i>✓</i>ใบเสนอราคา ราย A, ราย B</div>
   ${blocked()?'<div class="bul" style="color:var(--warn)"><i>✕</i>ใบเสนอราคา รายที่ 3 · ยังไม่ได้แนบ</div>':'<div class="bul"><i>✓</i>ใบเสนอราคา รายที่ 3</div>'}</div>
  <div class="note">ส่งโดย แพรว (เลขาฯ) · “ฝ่ายกฎหมายตรวจแล้ว ขอให้ทันก่อนประชุม 17:00”</div></div>`;
}

function sigVisual(done){

/* ================= render ================= */
/* render แยกเป็น 4 เลเยอร์ (หน้า / sheet / overlay / toast)
   อัปเดตเฉพาะเลเยอร์ที่เปลี่ยนจริง → ไม่กระพริบ ไม่เล่นแอนิเมชันซ้ำ ไม่เสียตำแหน่งเลื่อนหรือโฟกัส */
const L={};
function setLayer(id,key,html){
  const el=$("#"+id), prev=L[id]||{};
  if(prev.html===html) return false;
  const same = prev.key===key && key!=null;
  const scroll = same ? [...el.querySelectorAll(".body,.pdf,.sb")].map(n=>n.scrollTop) : null;
  const ae=document.activeElement, fid=(same && ae && el.contains(ae) && ae.id) ? ae.id : null;
  const sel = fid && "selectionStart" in ae ? [ae.selectionStart,ae.selectionEnd] : null;
  el.innerHTML=html;
  el.classList.toggle("in", !same && !!html);
  if(scroll) el.querySelectorAll(".body,.pdf,.sb").forEach((n,i)=>{ if(scroll[i]!=null) n.scrollTop=scroll[i]; });
  if(fid){ const f=$("#"+fid); if(f){ f.focus({preventScroll:true}); if(sel) try{f.setSelectionRange(...sel)}catch(e){} } }
  L[id]={key,html}; return true;
}
function render(){
  const vk = S.view==="doc" ? "doc:"+S.tab : S.view;
  setLayer("lv", vk, V[S.view]());
  setLayer("ls", S.sheet, S.sheet ? SHEETS[S.sheet]() : "");
  setLayer("lo", S.overlay, S.overlay ? OVER[S.overlay]() : "");
  setLayer("lt", S.toast, S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : "");
  bindSlider(); bindHold(); bindPdf(); bindClock();
  const d=$("#draft"); if(d) d.oninput=e=>S.draft=e.target.value;
  const rt=$("#rejtxt"); if(rt) rt.oninput=e=>{S.rejectText=e.target.value; const b=$("#hold"); if(b) b.disabled=!S.rejectText.trim();};
  const rs=$("#reason"); if(rs) rs.onchange=e=>{S.reason=e.target.value; ev("reason_"+S.reason)};
}
/* ย่อทั้งเครื่องให้พอดีหน้าต่าง (เดสก์ท็อป) · มือถือแสดงเต็มจอ */
let SCALE=1;
function fit(){
  SCALE = matchMedia("(max-width:520px)").matches ? 1 : Math.min(1,(innerHeight-32)/956,(innerWidth-32)/440);
  document.documentElement.style.setProperty("--s",SCALE);
}
addEventListener("resize",fit); fit();
function toast(t,ms=2600){ S.toast=t; render(); later(()=>{S.toast=null; render()},ms); }

/* ================= interactions ================= */
function openDoc(){
  reset(); S.view="loading"; S.tab=0; ev("open_doc"); render();
  later(()=>{ S.view="doc"; render(); },1300);
}
function jumpPage(n){
  S.tab=1; S.sheet=null; render();
  const pg=$("#pg"+n), pdf=$("#pdf"); if(!pg||!pdf) return;
  pdf.scrollTo({top:pg.offsetTop-12,behavior:"smooth"});
  const hl=$("#hl"+n); if(hl){ hl.classList.add("flash"); later(()=>hl.classList.remove("flash"),2000); }
}
function jumpPin(){
  S.tab=1; render();
  const el=$("#pin"+S.pin), pdf=$("#pdf"); if(!el||!pdf) return;
  const pg=el.closest(".page");
  pdf.scrollTo({top:pg.offsetTop+el.offsetTop-pdf.clientHeight/2+40,behavior:"smooth"});
}
function bindPdf(){
  const pdf=$("#pdf"); if(!pdf) return;
  const ind=$("#pgind"); let hide;
  pdf.onscroll=()=>{
    const pages=pdf.querySelectorAll(".page"); let cur=1;
    for(const p of pages){ if(p.offsetTop-pdf.scrollTop < pdf.clientHeight*0.4) cur=+p.dataset.p; else break; }
    ind.textContent=`น. ${cur} / ${DOC.pages}`; ind.style.opacity=1;
    clearTimeout(hide); hide=setTimeout(()=>ind.style.opacity=0,1500);
  };
}
function startFace(){
  S.overlay="face"; S.faceState="scan"; render();
  later(()=>{
    const sc=S.scen.face;
    const willFail = (sc==="fail1" && S.faceTry===0) || sc==="lockout";
    if(willFail){
      S.faceTry++; KPI.faceFail++; ev("faceid_fail_"+S.faceTry);
      if(S.faceTry>=3){ S.overlay="pin"; S.pinCode=""; ev("biometric_lockout"); render(); return; }
      S.faceState="bad"; render(); vibrate([40,60,40]);
    } else {
      S.faceState="good"; render(); ev("faceid_ok"); later(()=>startSeal(),400);
    }
  },1100);
}
function startSeal(){
  S.overlay=null; S.sheet=null; S.view="sealing"; render();
  const steps=[...document.querySelectorAll("#prog .ps")], dt=480;
  const outcome=S.scen.outcome;
  const stopAt = outcome==="cert"?2 : outcome==="net"?2 : steps.length;
  steps.forEach((el,i)=>{ if(i<=stopAt) later(()=>{ if(i>0){steps[i-1].className="ps done";steps[i-1].querySelector(".ic").textContent="✓"} if(i<steps.length) el.className="ps on"; },i*dt); });
  if(outcome==="ok"){
    later(()=>{ const l=steps[steps.length-1]; l.className="ps done"; l.querySelector(".ic").textContent="✓"; },steps.length*dt);
    later(()=>{ S.signedAt=fmtNow(); S.signedTx="TX-"+Date.now().toString(36).toUpperCase().slice(-8); S.view="success"; S.styleChosen=true;
      ev(`SIGNED · time_to_sign=${((Date.now()-S.t0)/1000).toFixed(1)}s`); vibrate(30); render(); },steps.length*dt+450);
  } else if(outcome==="cert"){
    later(()=>{ S.view="certerr"; ev("error_cert_revoked"); render(); },3*dt+500);
  } else {
    later(()=>{ const n=$("#sealnote"); if(n) n.textContent="ใช้เวลานานกว่าปกติ กำลังลองเชื่อมต่อ…"; },3*dt+600);
    later(()=>{ S.view="neterr"; ev("error_network_rollback"); render(); },3*dt+4000);
  }
}
const vibrate=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* slider */
function bindSlider(){
  const el=$("#slide"); if(!el||el.classList.contains("off")||el._b) return; el._b=1;
  const knob=el.querySelector(".knob"), fill=el.querySelector(".fill"), lbl=el.querySelector(".lbl");
  let drag=false, sx=0, p=0, t0=0, crossed=false;
  const W=()=>(el.clientWidth-60)*SCALE; // pointer px อยู่ในหน่วยหลังย่อ
  const set=v=>{ p=Math.max(0,Math.min(1,v)); knob.style.left=`calc(4px + ${p} * (100% - 60px))`; fill.style.width=`calc(60px + ${p} * (100% - 60px))`;
    lbl.textContent=p>=.92?"ปล่อยเพื่อสแกน Face ID":"เลื่อนเพื่อลงนามด้วย Face ID  ›››"; el.setAttribute("aria-valuenow",Math.round(p*100));
    if(p>=.92&&!crossed){crossed=true;vibrate(15)} if(p<.92)crossed=false; };
  const fire=()=>{ if(Date.now()-t0<120){ springBack(); $("#slidenote").textContent="ลากช้าลงอีกนิด"; ev("slide_too_fast"); return; }
    set(1); ev("slide_complete"); later(startFace,150); };
  const springBack=()=>{ knob.style.transition="left .25s cubic-bezier(.3,1.4,.5,1)"; fill.style.transition="width .25s"; set(0); };
  knob.addEventListener("pointerdown",e=>{ drag=true; t0=Date.now(); sx=e.clientX-p*W(); knob.setPointerCapture(e.pointerId); knob.style.transition="none"; fill.style.transition="none"; });
  knob.addEventListener("pointermove",e=>{ if(drag) set((e.clientX-sx)/W()); });
  const end=()=>{ if(!drag) return; drag=false; if(p>=.92) fire(); else { if(p>.15){KPI.slipRelease++; ev("slide_released_early");} springBack(); } };
  knob.addEventListener("pointerup",end); knob.addEventListener("pointercancel",end);
  el.addEventListener("keydown",e=>{ if(e.key==="ArrowRight"){ e.preventDefault(); if(!t0) t0=Date.now()-500; set(p+.2); if(p>=.92) fire(); } if(e.key==="ArrowLeft"||e.key==="Escape") set(0); });
}
/* hold to confirm */
function bindHold(){
  const b=$("#hold"); if(!b||b._b) return; b._b=1; const f=b.querySelector(".hf"); let raf, start;
  const tick=()=>{ const k=Math.min(1,(Date.now()-start)/1500); f.style.width=(k*100)+"%"; if(k>=1){ stop(); ev("rejected"); S.sheet=null; S.view="rejected"; vibrate(30); render(); return;} raf=requestAnimationFrame(tick); };
  const stop=()=>{ cancelAnimationFrame(raf); };
  b.addEventListener("pointerdown",e=>{ if(b.disabled) return; start=Date.now(); b.setPointerCapture(e.pointerId); tick(); });
  const up=()=>{ stop(); f.style.transition="width .2s"; f.style.width="0"; setTimeout(()=>f.style.transition="",200); };
  b.addEventListener("pointerup",up); b.addEventListener("pointercancel",up); b.addEventListener("pointerleave",up);
}
/* facilitator: long-press the clock (or press F) */
function bindClock(){
  const c=$("#clock"); if(!c) return; let t;
  c.onpointerdown=()=>{ t=setTimeout(toggleFac,700); }; c.onpointerup=c.onpointerleave=()=>clearTimeout(t);
}
document.addEventListener("keydown",e=>{ if((e.key==="f"||e.key==="F") && !/TEXTAREA|INPUT|SELECT/.test(document.activeElement.tagName)) toggleFac(); });
let tripleN=0, tripleT;
document.addEventListener("pointerdown",e=>{ // fallback for phones without status bar: 3-finger... use triple tap top-left corner
  if(e.clientX<40 && e.clientY<60){ tripleN++; clearTimeout(tripleT); tripleT=setTimeout(()=>tripleN=0,600); if(tripleN>=3){tripleN=0;toggleFac();} }
});
function toggleFac(){ const f=$("#fac"); f.hidden=!f.hidden; if(!f.hidden) renderFac(); }
function renderFac(){
  const r=(k,opts)=>opts.map(([v,t])=>`<label><input type="radio" name="${k}" value="${v}" ${S.scen[k]===v?'checked':''}> ${t}</label>`).join("");
  $("#fac").innerHTML=`<h4>Facilitator <button class="ib" style="width:24px;height:24px;font-size:12px" data-f="close">✕</button></h4>
  <fieldset><legend>Face ID</legend>${r("face",[["ok","ผ่านทันที"],["fail1","ไม่ผ่าน 1 ครั้ง แล้วผ่าน"],["lockout","ไม่ผ่าน 3 ครั้ง → PIN"]])}</fieldset>
  <fieldset><legend>ผลการผนึกลายเซ็น</legend>${r("outcome",[["ok","สำเร็จ"],["cert","ใบรับรองถูกเพิกถอน"],["net","เน็ตหลุด (Rollback)"]])}</fieldset>
  <fieldset><legend>เอกสาร MSA</legend>${r("doc",[["normal","ปกติ"],["blocked","ขาดไฟล์แนบ (บล็อก)"],["noai","AI สรุปไม่ได้"]])}</fieldset>
  <fieldset><legend>ไฟล์ NDA</legend>${r("verify",[["valid","ลายเซ็นถูกต้อง"],["tamper","ถูกดัดแปลง"]])}</fieldset>
  <div class="kpi"><div>ปล่อยสไลด์ก่อนสุด<b>${KPI.slipRelease}</b></div><div>Face ID ไม่ผ่าน<b>${KPI.faceFail}</b></div></div>
  <div style="display:flex;gap:6px;margin-bottom:8px"><button class="btn ghost" style="height:32px;font-size:12px;flex:1" data-f="restart">เริ่มรอบใหม่</button><button class="btn ghost" style="height:32px;font-size:12px;flex:1" data-f="copy">คัดลอก Log</button></div>
  <div class="log" id="flog">${S.log.length?esc(S.log.join("\n")):"ยังไม่มีเหตุการณ์"}</div>
  <div class="note" style="margin-top:6px">เปิด/ปิดแผงนี้: กดค้างที่นาฬิกา, แตะมุมซ้ายบน 3 ครั้ง หรือกดปุ่ม F</div>`;
  const lg=$("#flog"); lg.scrollTop=lg.scrollHeight;
}
$("#fac").addEventListener("change",e=>{ if(e.target.name){ S.scen[e.target.name]=e.target.value; ev(`scenario ${e.target.name}=${e.target.value}`); if(S.view==="doc") render(); }});
$("#fac").addEventListener("click",e=>{
  const f=e.target.closest("[data-f]"); if(!f) return;
  if(f.dataset.f==="close") toggleFac();
  if(f.dataset.f==="restart"){ S.log.length=0; KPI.slipRelease=0; KPI.faceFail=0; reset(); render(); renderFac(); }
  if(f.dataset.f==="copy"){ const t=S.log.join("\n"); navigator.clipboard?.writeText(t).then(()=>f.textContent="คัดลอกแล้ว").catch(()=>{const r=document.createRange();r.selectNodeContents($("#flog"));getSelection().removeAllRanges();getSelection().addRange(r);}); }
});

/* main click router */
$("#scr").addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a, v=el.dataset.v;
  switch(a){
    case "open": openDoc(); break;
    case "openv": reset(); S.view="verify"; ev("open_nda_verify_"+S.scen.verify); render(); break;
    case "oos": toast("เอกสารนี้ไม่อยู่ในขอบเขตการทดสอบ"); break;
    case "close": case "inbox": ev("close_to_inbox"); S.view="inbox"; S.sheet=null; S.overlay=null; render(); break;
    case "more": toast("เมนูเพิ่มเติมไม่อยู่ในขอบเขตการทดสอบ"); break;
    case "tab": S.tab=+v; if(S.tab===2) S.unread=false; S.sheet=null; ev("tab_"+["summary","document","ask"][S.tab]); render(); if(S.tab===1) jumpPin(); break;
    case "jump": ev("ai_ref_page_"+v); jumpPage(+v); break;
    case "pinstep": S.pin=(S.pin+(+v)+DOC.pins.length)%DOC.pins.length; ev("jump_pin_"+(S.pin+1)); jumpPin(); break;
    case "pinjump": jumpPin(); break;
    case "style": S.sheet="style"; ev("open_signature_style"); render(); break;
    case "pickstyle": S.style=v; render(); break;
    case "stylesave": S.styleChosen=true; S.sheet=null; ev("style_"+S.style); render(); break;
    case "att": S.sheet="att"; ev("open_attachments"); render(); break;
    case "atttab": S.attTab=+v; render(); break;
    case "guard": S.sheet="guard"; S.intent=false; ev("open_guardrail"); render(); break;
    case "intent": S.intent=!S.intent; ev("intent_"+(S.intent?"checked":"unchecked")); render(); break;
    case "closesheet": if(S.sheet==="guard") ev("guardrail_closed"); S.sheet=null; render(); break;
    case "facecancel": ev("faceid_cancel"); S.overlay=null; S.faceTry=0; S.pinCode=""; render(); toast("ยกเลิกแล้ว ไม่มีการลงนามหรือบันทึกใดๆ"); break;
    case "faceretry": startFace(); break;
    case "key":
      if(v==="⌫") S.pinCode=S.pinCode.slice(0,-1); else if(S.pinCode.length<6) S.pinCode+=v;
      render();
      if(S.pinCode.length===6){ ev("signer_pin_ok"); later(startSeal,300); }
      break;
    case "retrynet": S.view="doc"; S.sheet="guard"; S.intent=true; ev("retry_after_network"); render(); startFace(); break;
    case "backdoc": S.view="doc"; S.tab=0; render(); break;
    case "verify": S.view="verify"; render(); break;
    case "reject": S.sheet="reject"; S.rejectText=""; ev("open_reject"); render(); break;
    case "rejpick": S.rejectText=v; render(); break;
    case "askattach": S.tab=2; S.askTo=0; S.draft="รบกวนแนบใบเสนอราคาเปรียบเทียบรายที่ 3 ด้วยครับ"; ev("ask_missing_attachment"); render(); break;
    case "askto": S.askTo=+v; render(); break;
    case "send": {
      const t=(S.draft||"").trim(); if(!t){ toast("พิมพ์คำถามก่อนส่ง"); break; }
      const who=["แพรว (เลขาฯ)","ฝ่ายกฎหมาย","CFO"][S.askTo];
      const tm=new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"});
      S.questions.push({me:true,t,who:"ถึง "+who,time:tm}); S.draft=""; ev("question_sent_to_"+["secretary","legal","cfo"][S.askTo]); render();
      later(()=>{ S.questions.push({me:false,t:S.askTo===1?"ข้อ 8.2 ABC ขอลดเพดาน เราแลกกับส่วนลด 3% ครับ":"รับทราบค่ะ กำลังตรวจสอบและจะตอบภายใน 15 นาที",who:who,time:new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})}); if(S.tab!==2) S.unread=true; if(S.view==="doc") render(); },3500);
      break; }
    case "toast": toast(v); break;
  }
});
render();
</script>
</body>
</html>
